name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap project files
        shell: bash
        run: |
          if [ ! -d app ]; then
            mkdir -p /tmp/ice-project
            echo '' | base64 -d > /tmp/ice-project.tar.gz
            tar -xzf /tmp/ice-project.tar.gz -C /tmp/ice-project
            cp -R /tmp/ice-project/. .
          fi

      - name: Commit project files
        
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle.kts settings.gradle.kts gradle.properties README.md ROUTE_FLOW_V0.2.md
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap Android project"
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ice-Route-Planner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
